name: Validation
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification syntaxique
        run: |
          node --check app.js
          node --check storage-backup.js
          node --check crypto-vault.js
          node --check sw.js
      - name: Tests sauvegarde
        run: node --test tests/*.test.cjs

  browser-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier l'application dans Chromium
        run: node tests/browser-smoke.cjs
